<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>learn — Dinith Heshan</title>
<meta name="description" content="Interactive pages for concepts in computer science and software engineering.">
<meta property="og:title" content="learn — Dinith Heshan">
<meta property="og:description" content="Interactive pages for concepts in computer science and software engineering.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://dinith-heshan.github.io/learn/">
<meta property="og:image" content="https://dinith-heshan.github.io/learn/assets/og-default.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2312585d'/><rect x='7' y='13' width='18' height='2.6' rx='1.3' fill='%23faf8f3'/><rect x='7' y='19' width='11' height='2.6' rx='1.3' fill='%23faf8f3' opacity='.55'/></svg>">

<style>
  :root {
    --bg:        #f4efe4;
    --panel:     #faf8f3;
    --ink:       #1c1915;
    --muted:     #5d564a;
    --faint:     #6f6a60;
    --rule:      #ddd4c2;
    --rule-soft: #e9e2d4;

    --c1:    #ad3311;
    --c2:    #12585d;
    --c3:    #34306b;
    --c1-bg: #f6e4d9;
    --c2-bg: #dcebea;
    --c3-bg: #e4e2f0;

    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 880px;
    margin: 0 auto;
    padding: 44px 40px 80px;
  }

  :focus-visible {
    outline: 2px solid var(--c2);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ---------- masthead ---------- */

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .wordmark {
    margin: 0;
    font-family: var(--mono);
    font-size: 27px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .wordmark .slash { color: var(--c2); }

  .repo {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 1px;
  }

  .repo:hover { color: var(--c2); border-bottom-color: var(--c2); }

  .tagline {
    margin: 10px 0 0;
    max-width: 54ch;
    color: var(--muted);
    font-size: 15px;
  }

  /* ---------- search ---------- */

  .controls {
    margin-top: 30px;
    padding-top: 26px;
    border-top: 1px solid var(--rule);
  }

  .field { position: relative; }

  .field input {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    font-family: var(--sans);
    font-size: 15px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 11px 52px 11px 14px;
  }

  .field input::placeholder { color: var(--faint); }
  .field input:focus { border-color: var(--c2); outline: none; }
  .field input::-webkit-search-cancel-button { -webkit-appearance: none; }

  .key {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--faint);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 1px 6px;
    pointer-events: none;
    transition: opacity .12s;
  }

  .field input:focus ~ .key { opacity: 0; }

  .count {
    margin: 14px 0 0;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--faint);
    letter-spacing: 0.01em;
  }

  /* ---------- list ---------- */

  .list {
    list-style: none;
    margin: 18px 0 0;
    padding: 0;
  }

  .list li { border-top: 1px solid var(--rule); }
  .list li:last-child { border-bottom: 1px solid var(--rule); }

  .row {
    display: grid;
    grid-template-columns: 98px 1fr;
    gap: 28px;
    padding: 19px 10px 19px 4px;
    text-decoration: none;
    color: inherit;
    transition: background .12s;
  }

  .row:hover { background: var(--panel); }

  .date {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    padding-top: 4px;
    white-space: nowrap;
  }

  .row:hover .date { color: var(--ink); }

  .title {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .row:hover .title { color: var(--c2); }

  .summary {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 14.5px;
  }

  /* ---------- states ---------- */

  .msg {
    padding: 46px 4px;
    color: var(--muted);
    font-size: 15px;
    max-width: 60ch;
  }

  .msg strong {
    display: block;
    color: var(--ink);
    font-size: 16px;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .msg code {
    font-family: var(--mono);
    font-size: 13px;
    background: var(--rule-soft);
    border-radius: 4px;
    padding: 1px 5px;
  }

  /* ---------- footer ---------- */

  .foot {
    margin-top: 46px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    font-size: 13.5px;
    color: var(--muted);
  }

  .foot a { color: var(--muted); }
  .foot a:hover { color: var(--c2); }

  /* ---------- motion ---------- */

  .list li { animation: rise .32s cubic-bezier(.22, .8, .3, 1) backwards; }
  .list.still li { animation: none; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ---------- narrow ---------- */

  @media (max-width: 560px) {
    .page { padding: 30px 18px 60px; }
    .wordmark { font-size: 24px; }
    .row { grid-template-columns: 1fr; gap: 7px; }
    .date { order: 2; padding-top: 0; font-size: 12px; }
    .key { display: none; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <h1 class="wordmark">learn<span class="slash">/</span></h1>
    <a class="repo" href="https://github.com/dinith-heshan/learn">github.com/dinith-heshan/learn</a>
  </header>

  <p class="tagline">Interactive pages for concepts in computer science and software engineering.</p>

  <div class="controls">
    <div class="field">
      <input id="q" type="search" aria-label="Search concepts"
             placeholder="Search" autocomplete="off" spellcheck="false">
      <span class="key">/</span>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
  </div>

  <ul class="list" id="list"></ul>
  <div class="msg" id="msg" hidden></div>

  <footer class="foot">
    Suggestions and corrections —
    <a href="https://github.com/dinith-heshan/learn/issues/new">open an issue</a>.
  </footer>

</div>

<script>
(function () {
  "use strict";

  const $list  = document.getElementById("list");
  const $msg   = document.getElementById("msg");
  const $count = document.getElementById("count");
  const $q     = document.getElementById("q");

  let concepts = [];
  let query = "";
  let firstPaint = true;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }

  function matches(c) {
    if (!query) return true;
    const hay = (String(c.title || "") + " " + String(c.summary || "")).toLowerCase();
    return query.toLowerCase().split(/\s+/).every(function (w) {
      return hay.indexOf(w) !== -1;
    });
  }

  function message(title, body) {
    $list.innerHTML = "";
    $msg.hidden = false;
    $msg.innerHTML = "<strong>" + title + "</strong>" + body;
  }

  function render() {
    const items = concepts.filter(matches);

    if (concepts.length === 0) {
      $count.textContent = "";
      message("No concepts yet.",
        "The first entry goes in <code>concepts.json</code>, with its page at "
        + "<code>concepts/&lt;slug&gt;/index.html</code>.");
      return;
    }

    $count.textContent = query
      ? items.length + " of " + concepts.length
      : concepts.length + (concepts.length === 1 ? " concept" : " concepts");

    if (items.length === 0) {
      message("Nothing matches.", "Try a shorter search.");
      return;
    }

    $msg.hidden = true;
    $list.className = firstPaint ? "list" : "list still";

    $list.innerHTML = items.map(function (c, i) {
      const delay = firstPaint ? Math.min(i * 24, 260) : 0;
      return '<li style="animation-delay:' + delay + 'ms">'
        + '<a class="row" href="concepts/' + encodeURIComponent(c.slug) + '/">'
        + '<span class="date">' + esc(c.added) + '</span>'
        + '<span>'
        + '<h2 class="title">' + esc(c.title) + '</h2>'
        + (c.summary ? '<p class="summary">' + esc(c.summary) + '</p>' : '')
        + '</span></a></li>';
    }).join("");

    firstPaint = false;
  }

  $q.addEventListener("input", function () {
    query = $q.value.trim();
    render();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== $q) {
      e.preventDefault();
      $q.focus();
    } else if (e.key === "Escape" && document.activeElement === $q) {
      $q.value = "";
      query = "";
      render();
      $q.blur();
    }
  });

  fetch("concepts.json", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      concepts = (data && Array.isArray(data.concepts) ? data.concepts : [])
        .slice()
        .sort(function (a, b) {
          return String(b.added || "").localeCompare(String(a.added || ""));
        });
      render();
    })
    .catch(function () {
      $count.textContent = "";
      message("Couldn't load concepts.json.",
        "This page reads its list over the network, so opening the file straight from "
        + "disk won't work. View it on GitHub Pages, or run "
        + "<code>python3 -m http.server</code> in the repo folder and open "
        + "<code>localhost:8000</code>.");
    });
})();
</script>
</body>
</html>
